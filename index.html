<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>競馬新聞</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--fg:#1d1d1b;--sub:#6b6a63;--line:#dcd9cf;--gold:#c9a45c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1e1e1c;--fg:#ecebe6;--sub:#a3a199;--line:#34332f}}
:root[data-theme="dark"]{--bg:#141413;--card:#1e1e1c;--fg:#ecebe6;--sub:#a3a199;--line:#34332f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
header{background:linear-gradient(180deg,#17130a,#0d0b07);border-bottom:2px solid var(--gold);padding:14px 16px}
header h1{margin:0;color:#e8c56a;font-size:22px;letter-spacing:.14em;font-family:"Shippori Mincho","Yu Mincho",serif}
header p{margin:4px 0 0;color:#f3ead2;opacity:.8;font-size:13px}
main{max-width:720px;margin:0 auto;padding:16px;display:grid;gap:12px}
a.v{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:10px;padding:16px;text-decoration:none;color:var(--fg)}
a.v b{font-size:26px;font-family:"Shippori Mincho","Yu Mincho",serif;min-width:4.5em}
a.v span{color:var(--sub);font-size:14px;line-height:1.5}
a.v i{margin-left:auto;font-style:normal;color:var(--gold);font-size:22px}
.empty{color:var(--sub);text-align:center;padding:40px}
</style>
</head>
<body>
<header><h1>競馬新聞</h1><p id="d">開催場をえらんでください</p></header>
<main id="m"><div class="empty">読み込み中…</div></main>
<script>
// 場ごとの新聞へのリンク（11/7 テツさん「佐賀の新聞と高知の新聞を分けて」）。フォルダ名は publish_site.py の SLUG と同じ
const SLUG = {"帯広":"obihiro","門別":"monbetsu","盛岡":"morioka","水沢":"mizusawa","浦和":"urawa","船橋":"funabashi","大井":"ooi",
  "川崎":"kawasaki","金沢":"kanazawa","笠松":"kasamatsu","名古屋":"nagoya","園田":"sonoda","姫路":"himeji","高知":"kochi","佐賀":"saga"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const s = document.createElement("script");
s.src = "data/index.js?t=" + Date.now();
s.onload = () => {
  const I = window.SEISEKI_INDEX;
  if (!I || !I.tracks.length) { document.getElementById("m").innerHTML = '<div class="empty">今日の開催はまだありません</div>'; return; }
  document.getElementById("d").textContent = `${I.date}　開催場をえらんでください`;
  document.getElementById("m").innerHTML = I.tracks.map(t => {
    const ps = t.races.map(r => r.post).filter(Boolean);
    return `<a class="v" href="${SLUG[t.venue] || encodeURIComponent(t.venue)}/"><b>${esc(t.venue)}</b><span>全${t.races.length}R<br>${esc(ps[0] || "")}〜${esc(ps[ps.length - 1] || "")}</span><i>›</i></a>`;
  }).join("");
};
s.onerror = () => { document.getElementById("m").innerHTML = '<div class="empty">データがまだありません</div>'; };
document.head.appendChild(s);
</script>
</body>
</html>
